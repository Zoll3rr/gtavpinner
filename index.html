<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V Térkép & Jegyzettömb</title>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: rgba(30, 41, 59, 0.9);
            backdrop-filter: blur(10px);
            padding: 10px 15px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            z-index: 1000;
        }

        .tabs-container {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            flex-grow: 1;
            padding-bottom: 2px;
        }

        .tab {
            background-color: rgba(51, 65, 85, 0.6);
            color: #cbd5e1;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            white-space: nowrap;
            user-select: none;
            transition: all 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .tab:hover {
            background-color: rgba(71, 85, 105, 0.8);
            color: #fff;
        }

        .tab.active {
            background-color: #2563eb;
            color: #fff;
            font-weight: bold;
        }

        .tab .close-tab {
            font-size: 12px;
            background: rgba(0,0,0,0.2);
            border-radius: 50%;
            width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tab .close-tab:hover {
            background: #ef4444;
        }

        .btn-add-tab {
            background-color: #10b981;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .btn-add-tab:hover {
            background-color: #059669;
        }

        .role-container {
            display: flex;
            align-items: center;
            background-color: rgba(15, 23, 42, 0.6);
            padding: 4px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .role-btn {
            padding: 6px 12px;
            border: none;
            border-radius: 6px;
            background: transparent;
            color: #94a3b8;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .role-btn.active-editor {
            background-color: #ef4444;
            color: #ffffff;
        }

        .role-btn.active-viewer {
            background-color: #3b82f6;
            color: #ffffff;
        }

        .main-container {
            display: flex;
            flex-grow: 1;
            height: calc(100% - 57px);
            position: relative;
        }

        .sidebar {
            width: 300px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
            z-index: 500;
        }

        .sidebar-header {
            padding: 15px;
            font-weight: bold;
            font-size: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            color: #38bdf8;
        }

        .notes-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .note-item {
            background: rgba(30, 41, 59, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }

        .note-item:hover {
            background: rgba(51, 65, 85, 0.8);
            border-color: #3b82f6;
        }

        .note-text {
            font-size: 13px;
            color: #f1f5f9;
            word-break: break-word;
            flex-grow: 1;
        }

        .note-actions {
            display: flex;
            gap: 6px;
            margin-left: 8px;
        }

        .action-btn {
            background: none;
            border: none;
            color: #94a3b8;
            cursor: pointer;
            font-size: 14px;
            padding: 2px 4px;
            border-radius: 4px;
        }

        .action-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.1);
        }

        #map {
            flex-grow: 1;
            height: 100%;
            background-color: #0fa8d7;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            border-radius: 12px;
            width: 360px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .glass-panel h3 {
            font-size: 16px;
            color: #f8fafc;
        }

        .glass-panel input, .glass-panel textarea {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 6px;
            padding: 10px;
            color: #fff;
            font-size: 14px;
            outline: none;
        }

        .glass-panel input:focus, .glass-panel textarea:focus {
            border-color: #3b82f6;
        }

        .glass-panel .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-modal {
            padding: 8px 16px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: bold;
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.1);
            color: #cbd5e1;
        }

        .btn-save {
            background: #2563eb;
            color: white;
        }

        .leaflet-tooltip {
            background-color: rgba(15, 23, 42, 0.9) !important;
            color: #ffffff !important;
            border: 1px solid #3b82f6 !important;
            border-radius: 6px !important;
            padding: 8px 12px !important;
            font-size: 13px !important;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.5) !important;
            white-space: pre-wrap !important;
            max-width: 250px;
        }

        /* Térképválasztó menü sötét témája */
        .leaflet-control-layers {
            background: rgba(30, 41, 59, 0.85) !important;
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            border-radius: 8px !important;
            color: #f8fafc !important;
            padding: 6px 10px !important;
        }
        .leaflet-control-layers-base label {
            cursor: pointer;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
    </style>
</head>
<body>

    <header>
        <div class="tabs-container" id="tabsContainer"></div>
        <button class="btn-add-tab" id="addTabBtn" onclick="openNewTabModal()">+ Új Lap</button>
        
        <div class="role-container">
            <button class="role-btn active-viewer" id="btnViewer" onclick="setRole('viewer')">👁️ Olvasó</button>
            <button class="role-btn" id="btnEditor" onclick="setRole('editor')">✏️ Szerkesztő</button>
        </div>
    </header>

    <div class="main-container">
        <div class="sidebar">
            <div class="sidebar-header">📌 Jegyzetek Listája</div>
            <div class="notes-list" id="notesList"></div>
        </div>
        <div id="map"></div>
    </div>

    <div class="modal-overlay" id="customModal">
        <div class="glass-panel">
            <h3 id="modalTitle">Cím</h3>
            <div id="modalBody"></div>
            <div class="modal-buttons">
                <button class="btn-modal btn-cancel" onclick="closeModal()">Mégse</button>
                <button class="btn-modal btn-save" id="modalSaveBtn">Mentés</button>
            </div>
        </div>
    </div>

    <script>
        const EDITOR_PASSWORD = "admin123";
        let currentRole = "viewer";

        const MAP_WIDTH = 8192;
        const MAP_HEIGHT = 8192;
        const bounds = [[0, 0], [MAP_HEIGHT, MAP_WIDTH]];

        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -3,
            maxZoom: 2,
            maxBounds: bounds,
            maxBoundsViscosity: 0.8
        });

        // 1. Réteg: Atlas Map (Alapértelmezett)
        const atlasMap = L.imageOverlay('https://www.igrandtheftauto.com/content/images/xl/gtav-map-atlas-huge.jpg?etag=68481829', bounds);
        
        // 2. Réteg: Road Map
        const roadMap = L.imageOverlay('https://www.igrandtheftauto.com/content/images/gtav-map-roadmap-huge-1.jpg?etag=68481829', bounds);

        // 3. Réteg: Satellite Map
        const satelliteMap = L.imageOverlay('https://www.igrandtheftauto.com/content/images/gtav-map-satellite-huge.jpg?etag=68481829', bounds);

        // Alapértelmezett réteg hozzáadása
        atlasMap.addTo(map);

        // Rétegválasztó vezérlő (jobb felső sarok)
        const baseMaps = {
            "🗺️ Atlas Map": atlasMap,
            "🛣️ Road Map": roadMap,
            "🛰️ Satellite Map": satelliteMap
        };
        L.control.layers(baseMaps, null, { position: 'topright' }).addTo(map);

        map.fitBounds(bounds);

        let appData = JSON.parse(localStorage.getItem('gtav_map_data')) || {
            activeTabId: 'default',
            tabs: [
                { id: 'default', name: 'Fő Térkép', pins: [] }
            ]
        };

        let currentMarkers = [];
        let pendingLatLng = null;

        function saveData() {
            localStorage.setItem('gtav_map_data', JSON.stringify(appData));
        }

        function openModal(title, inputType, defaultValue, onSave) {
            document.getElementById('modalTitle').textContent = title;
            const body = document.getElementById('modalBody');
            body.innerHTML = '';

            let inputEl;
            if (inputType === 'textarea') {
                inputEl = document.createElement('textarea');
                inputEl.rows = 3;
            } else {
                inputEl = document.createElement('input');
                inputEl.type = inputType;
            }
            inputEl.id = 'modalInput';
            inputEl.value = defaultValue || '';
            body.appendChild(inputEl);

            const saveBtn = document.getElementById('modalSaveBtn');
            saveBtn.onclick = () => {
                const val = inputEl.value.trim();
                onSave(val);
                closeModal();
            };

            document.getElementById('customModal').classList.add('active');
            setTimeout(() => inputEl.focus(), 100);
        }

        function closeModal() {
            document.getElementById('customModal').classList.remove('active');
        }

        function setRole(role) {
            if (role === 'editor' && currentRole !== 'editor') {
                openModal("Szerkesztői Jelszó", "password", "", (password) => {
                    if (password === EDITOR_PASSWORD) {
                        currentRole = 'editor';
                        updateRoleUI();
                        renderTabs();
                        renderNotesList();
                    } else if (password) {
                        alert("Hibás jelszó!");
                    }
                });
            } else if (role === 'viewer') {
                currentRole = 'viewer';
                updateRoleUI();
                renderTabs();
                renderNotesList();
            }
        }

        function updateRoleUI() {
            const btnViewer = document.getElementById('btnViewer');
            const btnEditor = document.getElementById('btnEditor');
            const addTabBtn = document.getElementById('addTabBtn');

            if (currentRole === 'editor') {
                btnEditor.className = 'role-btn active-editor';
                btnViewer.className = 'role-btn';
                addTabBtn.style.display = 'inline-block';
            } else {
                btnViewer.className = 'role-btn active-viewer';
                btnEditor.className = 'role-btn';
                addTabBtn.style.display = 'none';
            }
        }

        function renderTabs() {
            const container = document.getElementById('tabsContainer');
            container.innerHTML = '';

            appData.tabs.forEach(tab => {
                const tabEl = document.createElement('div');
                tabEl.className = `tab ${tab.id === appData.activeTabId ? 'active' : ''}`;
                
                const titleSpan = document.createElement('span');
                titleSpan.textContent = tab.name;
                titleSpan.onclick = () => switchTab(tab.id);
                tabEl.appendChild(titleSpan);

                if (currentRole === 'editor' && appData.tabs.length > 1) {
                    const closeBtn = document.createElement('span');
                    closeBtn.className = 'close-tab';
                    closeBtn.innerHTML = '&times;';
                    closeBtn.onclick = (e) => {
                        e.stopPropagation();
                        deleteTab(tab.id);
                    };
                    tabEl.appendChild(closeBtn);
                }

                container.appendChild(tabEl);
            });
        }

        function loadCurrentTabPins() {
            currentMarkers.forEach(m => map.removeLayer(m.marker));
            currentMarkers = [];

            const currentTab = appData.tabs.find(t => t.id === appData.activeTabId);
            if (!currentTab) return;

            currentTab.pins.forEach(pin => {
                addMarkerToMap(pin);
            });

            renderNotesList();
        }

        function addMarkerToMap(pin) {
            const marker = L.marker([pin.lat, pin.lng]).addTo(map);

            marker.bindTooltip(pin.note, {
                permanent: false,
                direction: 'top',
                offset: [0, -20]
            });

            marker.on('click', () => {
                if (currentRole === 'editor') {
                    editPinNote(pin.id);
                }
            });

            marker.on('contextmenu', () => {
                if (currentRole === 'editor') {
                    deletePin(pin.id);
                }
            });

            currentMarkers.push({ id: pin.id, marker: marker });
        }

        function renderNotesList() {
            const listEl = document.getElementById('notesList');
            listEl.innerHTML = '';

            const currentTab = appData.tabs.find(t => t.id === appData.activeTabId);
            if (!currentTab || currentTab.pins.length === 0) {
                listEl.innerHTML = '<div style="color: #64748b; font-size: 12px; text-align: center; padding: 20px;">Nincsenek jegyzetek ezen a lapon.</div>';
                return;
            }

            currentTab.pins.forEach(pin => {
                const item = document.createElement('div');
                item.className = 'note-item';
                
                const text = document.createElement('div');
                text.className = 'note-text';
                text.textContent = pin.note;
                item.appendChild(text);

                item.onclick = () => {
                    map.flyTo([pin.lat, pin.lng], 1, { duration: 1 });
                    const mObj = currentMarkers.find(m => m.id === pin.id);
                    if (mObj) mObj.marker.openTooltip();
                };

                if (currentRole === 'editor') {
                    const actions = document.createElement('div');
                    actions.className = 'note-actions';

                    const editBtn = document.createElement('button');
                    editBtn.className = 'action-btn';
                    editBtn.innerHTML = '✏️';
                    editBtn.title = 'Szerkesztés';
                    editBtn.onclick = (e) => {
                        e.stopPropagation();
                        editPinNote(pin.id);
                    };

                    const delBtn = document.createElement('button');
                    delBtn.className = 'action-btn';
                    delBtn.innerHTML = '🗑️';
                    delBtn.title = 'Törlés';
                    delBtn.onclick = (e) => {
                        e.stopPropagation();
                        deletePin(pin.id);
                    };

                    actions.appendChild(editBtn);
                    actions.appendChild(delBtn);
                    item.appendChild(actions);
                }

                listEl.appendChild(item);
            });
        }

        function editPinNote(pinId) {
            const currentTab = appData.tabs.find(t => t.id === appData.activeTabId);
            const pin = currentTab.pins.find(p => p.id === pinId);
            if (!pin) return;

            openModal("Jegyzet Szerkesztése", "textarea", pin.note, (newNote) => {
                if (newNote) {
                    pin.note = newNote;
                    saveData();
                    
                    const mObj = currentMarkers.find(m => m.id === pinId);
                    if (mObj) {
                        mObj.marker.setTooltipContent(newNote);
                    }
                    renderNotesList();
                }
            });
        }

        function deletePin(pinId) {
            const currentTab = appData.tabs.find(t => t.id === appData.activeTabId);
            currentTab.pins = currentTab.pins.filter(p => p.id !== pinId);
            saveData();

            const mObj = currentMarkers.find(m => m.id === pinId);
            if (mObj) {
                map.removeLayer(mObj.marker);
                currentMarkers = currentMarkers.filter(m => m.id !== pinId);
            }

            renderNotesList();
        }

        map.on('click', (e) => {
            if (currentRole !== 'editor') return;

            pendingLatLng = e.latlng;
            openModal("Új Jegyzet Hozzáadása", "textarea", "", (note) => {
                if (note && pendingLatLng) {
                    const newPin = {
                        id: Date.now().toString(),
                        lat: pendingLatLng.lat,
                        lng: pendingLatLng.lng,
                        note: note
                    };

                    const currentTab = appData.tabs.find(t => t.id === appData.activeTabId);
                    currentTab.pins.push(newPin);
                    saveData();

                    addMarkerToMap(newPin);
                    renderNotesList();
                }
                pendingLatLng = null;
            });
        });

        function openNewTabModal() {
            if (currentRole !== 'editor') return;

            openModal("Új Lap Létrehozása", "text", "", (name) => {
                if (name) {
                    const newTab = {
                        id: Date.now().toString(),
                        name: name,
                        pins: []
                    };
                    appData.tabs.push(newTab);
                    appData.activeTabId = newTab.id;
                    saveData();
                    renderTabs();
                    loadCurrentTabPins();
                }
            });
        }

        function switchTab(tabId) {
            appData.activeTabId = tabId;
            saveData();
            renderTabs();
            loadCurrentTabPins();
        }

        function deleteTab(tabId) {
            if (currentRole !== 'editor') return;

            appData.tabs = appData.tabs.filter(t => t.id !== tabId);
            if (appData.activeTabId === tabId) {
                appData.activeTabId = appData.tabs[0].id;
            }
            saveData();
            renderTabs();
            loadCurrentTabPins();
        }

        updateRoleUI();
        renderTabs();
        loadCurrentTabPins();
    </script>
</body>
</html>
