<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GTA V Térkép & Jegyzettömb</title>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #030712;
            color: #f3f4f6;
            display: flex;
            flex-direction: column;
        }

        /* Felső Fejléc Glassmorphism */
        header {
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 1000;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3);
        }

        .tabs-container {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            flex-grow: 1;
            padding-bottom: 2px;
        }

        .tab {
            background: rgba(255, 255, 255, 0.04);
            color: #9ca3af;
            padding: 9px 16px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 13px;
            font-weight: 600;
            white-space: nowrap;
            user-select: none;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(10px);
        }

        .tab:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #f3f4f6;
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-1px);
        }

        .tab.active {
            background: linear-gradient(135deg, rgba(59, 130, 246, 0.4) 0%, rgba(37, 99, 235, 0.2) 100%);
            color: #60a5fa;
            border: 1px solid rgba(96, 165, 250, 0.4);
            box-shadow: 0 0 20px rgba(37, 99, 235, 0.25);
        }

        .tab .tab-action-btn {
            font-size: 11px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .tab .tab-action-btn:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.1);
        }

        .tab .close-tab:hover {
            background: rgba(239, 68, 68, 0.6);
            color: #fff;
        }

        .btn-add-tab {
            background: linear-gradient(135deg, #10b981 0%, #059669 100%);
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 700;
            font-size: 13px;
            transition: all 0.3s;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.3);
        }

        .btn-add-tab:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 25px rgba(16, 185, 129, 0.5);
        }

        .role-container {
            display: flex;
            align-items: center;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .role-btn {
            padding: 7px 14px;
            border: none;
            border-radius: 10px;
            background: transparent;
            color: #6b7280;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
        }

        .role-btn.active-editor {
            background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%);
            color: #ffffff;
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
        }

        .role-btn.active-viewer {
            background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
            color: #ffffff;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }

        .main-container {
            display: flex;
            flex-grow: 1;
            height: calc(100% - 65px);
            position: relative;
        }

        /* Oldalsáv Glassmorphism */
        .sidebar {
            width: 320px;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-right: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            flex-direction: column;
            z-index: 500;
            box-shadow: 10px 0 30px rgba(0,0,0,0.3);
        }

        .sidebar-header {
            padding: 18px 20px;
            font-weight: 700;
            font-size: 14px;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            color: #38bdf8;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .notes-list {
            flex-grow: 1;
            overflow-y: auto;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .note-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 12px 14px;
            border-radius: 12px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.25s ease;
        }

        .note-item:hover {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(56, 189, 248, 0.3);
            transform: translateX(3px);
        }

        .note-color-badge {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 12px;
            flex-shrink: 0;
            box-shadow: 0 0 10px currentColor;
        }

        .note-text {
            font-size: 13px;
            color: #e5e7eb;
            word-break: break-word;
            flex-grow: 1;
            font-weight: 500;
        }

        .note-actions {
            display: flex;
            gap: 6px;
            margin-left: 10px;
        }

        .action-btn {
            background: none;
            border: none;
            color: #9ca3af;
            cursor: pointer;
            font-size: 14px;
            padding: 4px 6px;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .action-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.15);
        }

        #map {
            flex-grow: 1;
            height: 100%;
            background-color: #030712;
        }

        /* Áttetsző Glass Modal (Popup) */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(3, 7, 18, 0.6);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .glass-panel {
            background: rgba(15, 23, 42, 0.65);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7), 0 0 30px rgba(56, 189, 248, 0.15);
            border-radius: 20px;
            width: 400px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes modalPop {
            0% { transform: scale(0.9); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .glass-panel h3 {
            font-size: 18px;
            font-weight: 700;
            color: #f9fafb;
            letter-spacing: -0.3px;
        }

        .glass-panel label {
            font-size: 12px;
            font-weight: 600;
            color: #9ca3af;
            margin-bottom: 6px;
            display: block;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .glass-panel input[type="text"], 
        .glass-panel input[type="password"], 
        .glass-panel textarea {
            width: 100%;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 12px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.25s;
        }

        .glass-panel input:focus, .glass-panel textarea:focus {
            border-color: #38bdf8;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.3);
            background: rgba(0, 0, 0, 0.5);
        }

        .color-picker-wrapper {
            display: flex;
            align-items: center;
            gap: 14px;
            background: rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 14px;
            border-radius: 10px;
        }

        .color-picker-wrapper input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }

        .color-picker-wrapper input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }

        .color-picker-wrapper input[type="color"]::-webkit-color-swatch {
            border: 2px solid rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            box-shadow: 0 0 10px currentColor;
        }

        .glass-panel .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 6px;
        }

        .btn-modal {
            padding: 10px 20px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            transition: all 0.25s;
        }

        .btn-cancel {
            background: rgba(255, 255, 255, 0.06);
            color: #9ca3af;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.12);
            color: #fff;
        }

        .btn-save {
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: white;
            box-shadow: 0 0 15px rgba(37, 99, 235, 0.4);
        }

        .btn-save:hover {
            box-shadow: 0 0 25px rgba(37, 99, 235, 0.6);
            transform: translateY(-1px);
        }

        /* Tooltip stílusok */
        .leaflet-tooltip {
            background: rgba(15, 23, 42, 0.75) !important;
            backdrop-filter: blur(12px) !important;
            -webkit-backdrop-filter: blur(12px) !important;
            color: #ffffff !important;
            border: 1px solid rgba(255, 255, 255, 0.15) !important;
            border-radius: 10px !important;
            padding: 10px 14px !important;
            font-size: 13px !important;
            font-weight: 500 !important;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5) !important;
            white-space: pre-wrap !important;
            max-width: 260px;
        }

        /* Térképválasztó Glassmorphism */
        .leaflet-control-layers {
            background: rgba(15, 23, 42, 0.6) !important;
            backdrop-filter: blur(16px) !important;
            -webkit-backdrop-filter: blur(16px) !important;
            border: 1px solid rgba(255, 255, 255, 0.12) !important;
            border-radius: 14px !important;
            color: #f3f4f6 !important;
            padding: 8px 12px !important;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4) !important;
        }

        .leaflet-control-layers-base label {
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 4px 0;
        }

        /* Custom Diamond Pin animáció */
        .custom-pin-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .custom-pin-icon:hover {
            transform: scale(1.25) translateY(-6px);
            z-index: 1000 !important;
        }
    </style>
</head>
<body>

    <header>
        <div class="tabs-container" id="tabsContainer"></div>
        <button class="btn-add-tab" id="addTabBtn" onclick="openNewTabModal()">+ Új Lap</button>
        
        <div class="role-container">
            <button class="role-btn active-viewer" id="btnViewer" onclick="setRole('viewer')">👁️ Olvasó</button>
            <button class="role-btn" id="btnEditor" onclick="setRole('editor')">✏️ Szerkesztő</button>
        </div>
    </header>

    <div class="main-container">
        <div class="sidebar">
            <div class="sidebar-header">📌 Jegyzetek Listája</div>
            <div class="notes-list" id="notesList"></div>
        </div>
        <div id="map"></div>
    </div>

    <div class="modal-overlay" id="customModal">
        <div class="glass-panel">
            <h3 id="modalTitle">Cím</h3>
            <div id="modalBody"></div>
            <div class="modal-buttons">
                <button class="btn-modal btn-cancel" onclick="closeModal()">Mégse</button>
                <button class="btn-modal btn-save" id="modalSaveBtn">Mentés</button>
            </div>
        </div>
    </div>

    <script>
        const EDITOR_PASSWORD = "admin123";
        let currentRole = "viewer";

        const MAP_WIDTH = 8192;
        const MAP_HEIGHT = 8192;
        const bounds = [[0, 0], [MAP_HEIGHT, MAP_WIDTH]];

        const map = L.map('map', {
            crs: L.CRS.Simple,
            minZoom: -3,
            maxZoom: 2,
            maxBounds: bounds,
            maxBoundsViscosity: 0.8
        });

        // Térképrétegek
        const atlasMap = L.imageOverlay('https://www.igrandtheftauto.com/content/images/xl/gtav-map-atlas-huge.jpg?etag=68481829', bounds);
        const roadMap = L.imageOverlay('https://www.igrandtheftauto.com/content/images/gtav-map-roadmap-huge-1.jpg?etag=68481829', bounds);
        const satelliteMap = L.imageOverlay('https://www.igrandtheftauto.com/content/images/gtav-map-satellite-huge.jpg?etag=68481829', bounds);

        atlasMap.addTo(map);

        const baseMaps = {
            "🗺️ Atlas Map": atlasMap,
            "🛣️ Road Map": roadMap,
            "🛰️ Satellite Map": satelliteMap
        };
        L.control.layers(baseMaps, null, { position: 'topright' }).addTo(map);

        map.fitBounds(bounds);

        let appData = JSON.parse(localStorage.getItem('gtav_map_data')) || {
            activeTabId: 'default',
            tabs: [
                { id: 'default', name: 'Fő Térkép', pins: [] }
            ]
        };

        let currentMarkers = [];
        let pendingLatLng = null;

        function saveData() {
            localStorage.setItem('gtav_map_data', JSON.stringify(appData));
        }

        // Plan B: Modern Csiszolt Üveg Gyémánt Pin
        function createCustomPinIcon(color = "#38bdf8") {
            const svgIcon = `
                <svg width="38" height="50" viewBox="0 0 38 50" fill="none" xmlns="http://www.w3.org/2000/svg" style="filter: drop-shadow(0px 6px 14px rgba(0,0,0,0.5));">
                    <!-- Sötét kontúrkeret, hogy világos háttéren is kontrasztos maradjon -->
                    <path d="M19 1 L37 17 L19 49 L1 17 Z" fill="#0f172a" fill-opacity="0.5" stroke="#0f172a" stroke-width="3"/>
                    
                    <!-- Áttetsző Színezett Üveg Test -->
                    <path d="M19 2 L36 17 L19 48 L2 17 Z" fill="${color}" fill-opacity="0.45" stroke="${color}" stroke-width="1.8"/>
                    
                    <!-- Felső élen csillanó fehér üvegfény (Glass Highlight) -->
                    <path d="M19 4 L33 17" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round" stroke-opacity="0.8"/>
                    
                    <!-- Belső színezett üvegmag -->
                    <circle cx="19" cy="20" r="6" fill="${color}" fill-opacity="0.85" stroke="#ffffff" stroke-width="1" stroke-opacity="0.6"/>
                    <circle cx="19" cy="20" r="2.5" fill="#ffffff" fill-opacity="0.9"/>
                </svg>
            `;
            return L.divIcon({
                className: 'custom-pin-icon',
                html: svgIcon,
                iconSize: [38, 50],
                iconAnchor: [19, 49],
                popupAnchor: [0, -45]
            });
        }

        function openModal(title, fields, onSave) {
            document.getElementById('modalTitle').textContent = title;
            const body = document.getElementById('modalBody');
            body.innerHTML = '';

            const inputElements = {};

            fields.forEach(field => {
                const wrapper = document.createElement('div');
                wrapper.style.marginBottom = '12px';

                if (field.label) {
                    const lbl = document.createElement('label');
                    lbl.textContent = field.label;
                    wrapper.appendChild(lbl);
                }

                if (field.type === 'textarea') {
                    const textarea = document.createElement('textarea');
                    textarea.rows = 3;
                    textarea.value = field.value || '';
                    wrapper.appendChild(textarea);
                    inputElements[field.id] = textarea;
                } else if (field.type === 'color') {
                    const colorWrapper = document.createElement('div');
                    colorWrapper.className = 'color-picker-wrapper';
                    
                    const colorInput = document.createElement('input');
                    colorInput.type = 'color';
                    colorInput.value = field.value || '#38bdf8';
                    
                    const hexLabel = document.createElement('span');
                    hexLabel.style.fontSize = '13px';
                    hexLabel.style.fontFamily = 'monospace';
                    hexLabel.style.fontWeight = 'bold';
                    hexLabel.style.color = '#38bdf8';
                    hexLabel.textContent = colorInput.value.toUpperCase();

                    colorInput.oninput = (e) => {
                        hexLabel.textContent = e.target.value.toUpperCase();
                        hexLabel.style.color = e.target.value;
                    };

                    colorWrapper.appendChild(colorInput);
                    colorWrapper.appendChild(hexLabel);
                    wrapper.appendChild(colorWrapper);
                    inputElements[field.id] = colorInput;
                } else {
                    const input = document.createElement('input');
                    input.type = field.type || 'text';
                    input.value = field.value || '';
                    wrapper.appendChild(input);
                    inputElements[field.id] = input;
                }

                body.appendChild(wrapper);
            });

            const saveBtn = document.getElementById('modalSaveBtn');
            saveBtn.onclick = () => {
                const results = {};
                for (let key in inputElements) {
                    results[key] = inputElements[key].value.trim();
                }
                onSave(results);
                closeModal();
            };

            document.getElementById('customModal').classList.add('active');
            const firstInput = body.querySelector('input[type="text"], textarea');
            if (firstInput) setTimeout(() => firstInput.focus(), 100);
        }

        function closeModal() {
            document.getElementById('customModal').classList.remove('active');
        }

        function setRole(role) {
            if (role === 'editor' && currentRole !== 'editor') {
                openModal("Szerkesztői Jelszó", [{ id: 'password', type: 'password', label: 'Add meg a jelszót:' }], (res) => {
                    if (res.password === EDITOR_PASSWORD) {
                        currentRole = 'editor';
                        updateRoleUI();
                        renderTabs();
                        renderNotesList();
                    } else if (res.password) {
                        alert("Hibás jelszó!");
                    }
                });
            } else if (role === 'viewer') {
                currentRole = 'viewer';
                updateRoleUI();
                renderTabs();
                renderNotesList();
            }
        }

        function updateRoleUI() {
            const btnViewer = document.getElementById('btnViewer');
            const btnEditor = document.getElementById('btnEditor');
            const addTabBtn = document.getElementById('addTabBtn');

            if (currentRole === 'editor') {
                btnEditor.className = 'role-btn active-editor';
                btnViewer.className = 'role-btn';
                addTabBtn.style.display = 'inline-block';
            } else {
                btnViewer.className = 'role-btn active-viewer';
                btnEditor.className = 'role-btn';
                addTabBtn.style.display = 'none';
            }
        }

        function renderTabs() {
            const container = document.getElementById('tabsContainer');
            container.innerHTML = '';

            appData.tabs.forEach(tab => {
                const tabEl = document.createElement('div');
                tabEl.className = `tab ${tab.id === appData.activeTabId ? 'active' : ''}`;
                
                const titleSpan = document.createElement('span');
                titleSpan.textContent = tab.name;
                titleSpan.onclick = () => switchTab(tab.id);
                
                if (currentRole === 'editor') {
                    titleSpan.ondblclick = (e) => {
                        e.stopPropagation();
                        renameTab(tab.id);
                    };
                }
                
                tabEl.appendChild(titleSpan);

                if (currentRole === 'editor') {
                    const editBtn = document.createElement('span');
                    editBtn.className = 'tab-action-btn';
                    editBtn.innerHTML = '✏️';
                    editBtn.title = 'Átnevezés';
                    editBtn.onclick = (e) => {
                        e.stopPropagation();
                        renameTab(tab.id);
                    };
                    tabEl.appendChild(editBtn);

                    if (appData.tabs.length > 1) {
                        const closeBtn = document.createElement('span');
                        closeBtn.className = 'tab-action-btn close-tab';
                        closeBtn.innerHTML = '&times;';
                        closeBtn.title = 'Törlés';
                        closeBtn.onclick = (e) => {
                            e.stopPropagation();
                            deleteTab(tab.id);
                        };
                        tabEl.appendChild(closeBtn);
                    }
                }

                container.appendChild(tabEl);
            });
        }

        function renameTab(tabId) {
            const tab = appData.tabs.find(t => t.id === tabId);
            if (!tab) return;

            openModal("Lap Átnevezése", [{ id: 'name', type: 'text', label: 'Lap új neve:', value: tab.name }], (res) => {
                if (res.name) {
                    tab.name = res.name;
                    saveData();
                    renderTabs();
                }
            });
        }

        function loadCurrentTabPins() {
            currentMarkers.forEach(m => map.removeLayer(m.marker));
            currentMarkers = [];

            const currentTab = appData.tabs.find(t => t.id === appData.activeTabId);
            if (!currentTab) return;

            currentTab.pins.forEach(pin => {
                addMarkerToMap(pin);
            });

            renderNotesList();
        }

        function addMarkerToMap(pin) {
            const pinColor = pin.color || '#38bdf8';
            const marker = L.marker([pin.lat, pin.lng], {
                icon: createCustomPinIcon(pinColor)
            }).addTo(map);

            marker.bindTooltip(pin.note, {
                permanent: false,
                direction: 'top',
                offset: [0, -40]
            });

            marker.on('click', () => {
                if (currentRole === 'editor') {
                    editPinNote(pin.id);
                }
            });

            marker.on('contextmenu', () => {
                if (currentRole === 'editor') {
                    deletePin(pin.id);
                }
            });

            currentMarkers.push({ id: pin.id, marker: marker });
        }

        function renderNotesList() {
            const listEl = document.getElementById('notesList');
            listEl.innerHTML = '';

            const currentTab = appData.tabs.find(t => t.id === appData.activeTabId);
            if (!currentTab || currentTab.pins.length === 0) {
                listEl.innerHTML = '<div style="color: #6b7280; font-size: 13px; text-align: center; padding: 25px;">Nincsenek jegyzetek ezen a lapon.</div>';
                return;
            }

            currentTab.pins.forEach(pin => {
                const item = document.createElement('div');
                item.className = 'note-item';
                
                const colorBadge = document.createElement('div');
                colorBadge.className = 'note-color-badge';
                colorBadge.style.backgroundColor = pin.color || '#38bdf8';
                colorBadge.style.color = pin.color || '#38bdf8';
                item.appendChild(colorBadge);

                const text = document.createElement('div');
                text.className = 'note-text';
                text.textContent = pin.note;
                item.appendChild(text);

                item.onclick = () => {
                    map.flyTo([pin.lat, pin.lng], 1, { duration: 1 });
                    const mObj = currentMarkers.find(m => m.id === pin.id);
                    if (mObj) mObj.marker.openTooltip();
                };

                if (currentRole === 'editor') {
                    const actions = document.createElement('div');
                    actions.className = 'note-actions';

                    const editBtn = document.createElement('button');
                    editBtn.className = 'action-btn';
                    editBtn.innerHTML = '✏️';
                    editBtn.title = 'Szerkesztés';
                    editBtn.onclick = (e) => {
                        e.stopPropagation();
                        editPinNote(pin.id);
                    };

                    const delBtn = document.createElement('button');
                    delBtn.className = 'action-btn';
                    delBtn.innerHTML = '🗑️';
                    delBtn.title = 'Törlés';
                    delBtn.onclick = (e) => {
                        e.stopPropagation();
                        deletePin(pin.id);
                    };

                    actions.appendChild(editBtn);
                    actions.appendChild(delBtn);
                    item.appendChild(actions);
                }

                listEl.appendChild(item);
            });
        }

        function editPinNote(pinId) {
            const currentTab = appData.tabs.find(t => t.id === appData.activeTabId);
            const pin = currentTab.pins.find(p => p.id === pinId);
            if (!pin) return;

            openModal("Jegyzet Szerkesztése", [
                { id: 'note', type: 'textarea', label: 'Jegyzet leírása:', value: pin.note },
                { id: 'color', type: 'color', label: 'Pin Színe (Hex):', value: pin.color || '#38bdf8' }
            ], (res) => {
                if (res.note) {
                    pin.note = res.note;
                    pin.color = res.color;
                    saveData();
                    
                    const mObj = currentMarkers.find(m => m.id === pinId);
                    if (mObj) {
                        mObj.marker.setIcon(createCustomPinIcon(res.color));
                        mObj.marker.setTooltipContent(res.note);
                    }
                    renderNotesList();
                }
            });
        }

        function deletePin(pinId) {
            const currentTab = appData.tabs.find(t => t.id === appData.activeTabId);
            currentTab.pins = currentTab.pins.filter(p => p.id !== pinId);
            saveData();

            const mObj = currentMarkers.find(m => m.id === pinId);
            if (mObj) {
                map.removeLayer(mObj.marker);
                currentMarkers = currentMarkers.filter(m => m.id !== pinId);
            }

            renderNotesList();
        }

        map.on('click', (e) => {
            if (currentRole !== 'editor') return;

            pendingLatLng = e.latlng;
            openModal("Új Jegyzet Hozzáadása", [
                { id: 'note', type: 'textarea', label: 'Jegyzet leírása:' },
                { id: 'color', type: 'color', label: 'Pin Színe (Hex):', value: '#38bdf8' }
            ], (res) => {
                if (res.note && pendingLatLng) {
                    const newPin = {
                        id: Date.now().toString(),
                        lat: pendingLatLng.lat,
                        lng: pendingLatLng.lng,
                        note: res.note,
                        color: res.color
                    };

                    const currentTab = appData.tabs.find(t => t.id === appData.activeTabId);
                    currentTab.pins.push(newPin);
                    saveData();

                    addMarkerToMap(newPin);
                    renderNotesList();
                }
                pendingLatLng = null;
            });
        });

        function openNewTabModal() {
            if (currentRole !== 'editor') return;

            openModal("Új Lap Létrehozása", [{ id: 'name', type: 'text', label: 'Lap neve:' }], (res) => {
                if (res.name) {
                    const newTab = {
                        id: Date.now().toString(),
                        name: res.name,
                        pins: []
                    };
                    appData.tabs.push(newTab);
                    appData.activeTabId = newTab.id;
                    saveData();
                    renderTabs();
                    loadCurrentTabPins();
                }
            });
        }

        function switchTab(tabId) {
            appData.activeTabId = tabId;
            saveData();
            renderTabs();
            loadCurrentTabPins();
        }

        function deleteTab(tabId) {
            if (currentRole !== 'editor') return;

            appData.tabs = appData.tabs.filter(t => t.id !== tabId);
            if (appData.activeTabId === tabId) {
                appData.activeTabId = appData.tabs[0].id;
            }
            saveData();
            renderTabs();
            loadCurrentTabPins();
        }

        updateRoleUI();
        renderTabs();
        loadCurrentTabPins();
    </script>
</body>
</html>
